name: school_abc
description: A new Flutter project.

publish_to: 'none' # Private package, tidak diterbitkan ke pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  audioplayers: ^6.5.1
  # versi terbaru fix namespace
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.3.1
  page_transition: ^2.0.5

  animations: ^2.0.11
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/quiz_audio/
    - assets/backsound/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#FFFFFF" # warna latar belakang (boleh diubah)
  adaptive_icon_foreground: "assets/icons/app_logo.png"
